<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% if page.title %}{{ page.title }} &#8211; {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ site.owner.name }}">

  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ site.url }}/images/{{ site.owner.avatar }}">
  <meta property="og:url" content="{{ site.url }}">

  {% if site.google_verify %}<meta name="google-site-verification" content="{{ site.google_verify }}">{% endif %}
  <link rel="canonical" href="{{ site.url }}{{ page.url | remove: 'index.html' }}">

  <!-- Favicon -->
  <link rel="shortcut icon" href="{{ site.url }}/images/fav.ico">
  <link rel="shortcut icon" type="image/png" href="{{ site.url }}/images/fav.png">

  <!-- Google Fonts: Nunito Sans (Latin) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ site.url }}/assets/css/academic.css">

  <script src="https://cdn.counter.dev/script.js" data-id="4c8f7caa-2b55-46cd-a995-2c4633303773" data-utcoffset="8"></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T5N5JY1E21"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T5N5JY1E21');
  </script>
</head>

<body>
  <!-- Sticky Top Glassmorphism Navigation -->
  <nav class="site-nav" aria-label="Main Navigation">
    <div class="nav-inner">
      <a href="#" class="nav-brand" aria-label="Back to top">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>{{ site.owner.name }}</span>
      </a>
      <div class="nav-links">
        <a href="#about-me">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>About</span>
        </a>
        <span class="nav-sep" aria-hidden="true"></span>
        <a href="#experience">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg>
          <span>Experience</span>
        </a>
        <span class="nav-sep" aria-hidden="true"></span>
        <a href="#news">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          <span>News</span>
        </a>
        <span class="nav-sep" aria-hidden="true"></span>
        <a href="#publications">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
          <span>Publications</span>
        </a>
        <span class="nav-sep" aria-hidden="true"></span>
        <a href="#services">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/></svg>
          <span>Services</span>
        </a>
        <span class="nav-sep" aria-hidden="true"></span>
        <a href="#teaching">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/></svg>
          <span>Teaching</span>
        </a>
        <span class="nav-sep" aria-hidden="true"></span>
        <a href="#honors">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
          <span>Honors</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Central Single-Column Content -->
  <main class="main-container">
    {% include profile-header.html %}
    <div id="main-content">
      {{ content }}
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="footer-flag">
      <a href="https://info.flagcounter.com/HMCq"><img src="https://s01.flagcounter.com/countxl/HMCq/bg_FFFFFF/txt_475569/border_E2E8F0/columns_8/maxflags_16/viewers_0/labels_1/pageviews_1/flags_0/percent_0/" alt="Flag Counter" border="0" loading="lazy"></a>
    </div>
    <p>&copy; <span id="current-year">2026</span> {{ site.owner.name }} &middot;
      Published with <a href="https://pages.github.com/" rel="nofollow">GitHub Pages</a>,
      powered by <a href="https://jekyllrb.com" rel="nofollow">Jekyll</a> &middot;
      Theme adapted from <a href="https://github.com/Laip11/academic-homepage-template" target="_blank" rel="noopener noreferrer">Academic Homepage Template</a>
    </p>
  </footer>

  <script src="{{ site.url }}/assets/js/academic.js"></script>
</body>
</html>
